[package]
name = "canvascycle-wallpaper"
version = "0.4.0"
edition = "2024"

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
macroquad = "0.4.16"
image = "0.24.9"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
    "dwmapi",
    "winuser",
    "shellscalingapi",
] }
