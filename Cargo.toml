[package]
name = "canvascycle-wallpaper"
version = "0.4.13"
edition = "2024"

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# macroquad = "0.4.16"
macroquad = { git = "https://github.com/ingobeans/macroquad.git", branch = "exposed-windows" }
image = "0.24.9"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
    "dwmapi",
    "winuser",
    "shellscalingapi",
] }
